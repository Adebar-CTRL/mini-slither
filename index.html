<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mini Slither</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mini Slither">
<meta name="theme-color" content="#0d1117">
<style>
:root{--bg:#0d1117;--grid:#161b22;--text:#e6edf3;--accent:#58a6ff}*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;touch-action:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}#wrap{position:fixed;inset:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}canvas{display:block;width:100%;height:100%;background:var(--bg)}#hud{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;color:var(--text);font-size:14px;font-weight:600;letter-spacing:.3px;z-index:10;text-shadow:0 1px 3px rgba(0,0,0,.6)}#hud .len{color:var(--accent)}#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(13,17,23,.92);color:var(--text);z-index:20;text-align:center;padding:24px}#overlay h1{font-size:28px;margin-bottom:8px}#overlay p{font-size:15px;opacity:.7;margin-bottom:24px;max-width:280px;line-height:1.4}#overlay .score{font-size:18px;color:var(--accent);margin-bottom:24px}button{background:var(--accent);color:#0d1117;border:none;padding:14px 32px;font-size:17px;font-weight:700;border-radius:999px;-webkit-appearance:none}button:active{opacity:.8}#boost-hint{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));right:16px;color:var(--text);opacity:.5;font-size:12px;z-index:10}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas><div id="hud">Länge: <span class="len" id="lenVal">10</span></div><div id="boost-hint">Halten = Boost</div><div id="overlay"><h1>🐍 Mini Slither</h1><p>Bewege den Finger / Maus, um zu steuern. Iss die Punkte, werde größer, vermeide andere Schlangen.</p><div class="score" id="finalScore" style="display:none"></div><button id="startBtn">Start</button></div></div>
<script>
(function(){const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),startBtn=document.getElementById('startBtn'),lenVal=document.getElementById('lenVal'),finalScore=document.getElementById('finalScore');let W,H,DPR;function resize(){DPR=window.devicePixelRatio||1;W=window.innerWidth;H=window.innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}window.addEventListener('resize',resize);resize();const WORLD=2400,FOOD_COUNT=220,BOT_COUNT=8;let food=[],snakes=[],player=null,running=false,pointer={x:0,y:0,active:false},camera={x:0,y:0};function rand(a,b){return a+Math.random()*(b-a)}function dist2(ax,ay,bx,by){const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy}function randColor(){const hues=[200,140,20,280,340,45,170],h=hues[Math.floor(Math.random()*hues.length)];return `hsl(${h}, 70%, 58%)`}function spawnFood(n){for(let i=0;i<n;i++)food.push({x:rand(0,WORLD),y:rand(0,WORLD),r:rand(3,5.5),color:`hsl(${Math.floor(rand(0,360))}, 80%, 62%)`})}function makeSnake(x,y,color,isBot){const seg=[];for(let i=0;i<10;i++)seg.push({x:x-i*6,y});return{segs:seg,dir:0,targetDir:0,speed:1.6,boosting:false,color,isBot,alive:true,thickness:6,botTimer:0}}function snakeLength(s){return s.segs.length}function resetGame(){food=[];snakes=[];spawnFood(FOOD_COUNT);player=makeSnake(WORLD/2,WORLD/2,'#58a6ff',false);snakes.push(player);for(let i=0;i<BOT_COUNT;i++)snakes.push(makeSnake(rand(200,WORLD-200),rand(200,WORLD-200),randColor(),true))}function headOf(s){return s.segs[0]}function updateSnake(s,dt){if(!s.alive)return;let diff=s.targetDir-s.dir;while(diff>Math.PI)diff-=Math.PI*2;while(diff<-Math.PI)diff+=Math.PI*2;const turnSpeed=4*dt;if(Math.abs(diff)<turnSpeed)s.dir=s.targetDir;else s.dir+=Math.sign(diff)*turnSpeed;const spd=(s.boosting?s.speed*1.9:s.speed)*60*dt,head=headOf(s),nx=head.x+Math.cos(s.dir)*spd,ny=head.y+Math.sin(s.dir)*spd;let bx=nx,by=ny,bounced=false;if(bx<20){bx=20;bounced=true}if(bx>WORLD-20){bx=WORLD-20;bounced=true}if(by<20){by=20;bounced=true}if(by>WORLD-20){by=WORLD-20;bounced=true}if(bounced&&s.isBot)s.targetDir=Math.atan2(WORLD/2-by,WORLD/2-bx)+rand(-.5,.5);s.segs.unshift({x:bx,y:by});const maxLen=10+Math.floor(s.growth||0);while(s.segs.length>maxLen)s.segs.pop();if(s.boosting&&s.segs.length>12){s.boostAccum=(s.boostAccum||0)+dt;if(s.boostAccum>.15){s.boostAccum=0;const tail=s.segs.pop();food.push({x:tail.x+rand(-5,5),y:tail.y+rand(-5,5),r:3,color:s.color});s.growth=Math.max(0,(s.growth||0)-1)}}}function botAI(s){s.botTimer-=1;if(s.botTimer<=0){s.botTimer=30+Math.random()*40;const head=headOf(s);let best=null,bd=Infinity;for(let i=0;i<food.length;i+=4){const f=food[i],d=dist2(head.x,head.y,f.x,f.y);if(d<bd){bd=d;best=f}}if(best)s.targetDir=Math.atan2(best.y-head.y,best.x-head.x)+rand(-.3,.3);else s.targetDir+=rand(-.6,.6)}}function checkFoodCollision(s){const head=headOf(s),eatR=s.thickness+6;for(let i=food.length-1;i>=0;i--){const f=food[i];if(dist2(head.x,head.y,f.x,f.y)<eatR*eatR){food.splice(i,1);s.growth=(s.growth||0)+2;if(!s.isBot)updateHUD(s)}}while(food.length<FOOD_COUNT)spawnFood(1)}function checkSnakeCollisions(){for(const s of snakes){if(!s.alive)continue;const head=headOf(s);for(const other of snakes){if(!other.alive)continue;const startIdx=other===s?8:0;for(let i=startIdx;i<other.segs.length;i++){const seg=other.segs[i],r=other.thickness*.9;if(dist2(head.x,head.y,seg.x,seg.y)<r*r){killSnake(s);return checkSnakeCollisions()}}}}}function killSnake(s){s.alive=false;for(let i=0;i<s.segs.length;i+=2)food.push({x:s.segs[i].x+rand(-8,8),y:s.segs[i].y+rand(-8,8),r:rand(3,5),color:s.color});if(s===player){running=false;finalScore.style.display='block';finalScore.textContent='Deine Länge: '+snakeLength(s);document.querySelector('#overlay h1').textContent='💀 Game Over';startBtn.textContent='Neustart';overlay.style.display='flex'}else setTimeout(()=>{const ns=makeSnake(rand(200,WORLD-200),rand(200,WORLD-200),randColor(),true);snakes.push(ns);snakes.splice(snakes.indexOf(s),1)},500)}function updateHUD(s){lenVal.textContent=snakeLength(s)}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#0d1117';ctx.fillRect(0,0,W,H);camera.x=headOf(player).x-W/2;camera.y=headOf(player).y-H/2;ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1;const gridSize=50,offX=-camera.x%gridSize,offY=-camera.y%gridSize;for(let x=offX;x<W;x+=gridSize){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=offY;y<H;y+=gridSize){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.strokeStyle='rgba(255,80,80,.5)';ctx.lineWidth=4;ctx.strokeRect(-camera.x,-camera.y,WORLD,WORLD);for(const f of food){const sx=f.x-camera.x,sy=f.y-camera.y;if(sx<-20||sx>W+20||sy<-20||sy>H+20)continue;ctx.beginPath();ctx.fillStyle=f.color;ctx.arc(sx,sy,f.r,0,Math.PI*2);ctx.fill()}for(const s of snakes){if(!s.alive)continue;for(let i=s.segs.length-1;i>=0;i--){const seg=s.segs[i],sx=seg.x-camera.x,sy=seg.y-camera.y;if(sx<-30||sx>W+30||sy<-30||sy>H+30)continue;ctx.beginPath();ctx.fillStyle=s.color;const r=s.thickness*(1-i/(s.segs.length*2.2));ctx.arc(sx,sy,Math.max(3,r),0,Math.PI*2);ctx.fill()}const head=headOf(s),hx=head.x-camera.x,hy=head.y-camera.y,ex=Math.cos(s.dir)*4,ey=Math.sin(s.dir)*4;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(hx+ex-ey*.6,hy+ey+ex*.6,2.2,0,Math.PI*2);ctx.arc(hx+ex+ey*.6,hy+ey-ex*.6,2.2,0,Math.PI*2);ctx.fill()}}let lastTime=0;function loop(t){if(!running)return;const dt=Math.min(.033,(t-lastTime)/1000||.016);lastTime=t;if(pointer.active){const head=headOf(player);player.targetDir=Math.atan2(pointer.y-H/2,pointer.x-W/2)}for(const s of snakes){if(s.isBot)botAI(s);updateSnake(s,dt);checkFoodCollision(s)}checkSnakeCollisions();updateHUD(player);draw();requestAnimationFrame(loop)}function pointerPos(e){const t=e.touches?e.touches[0]:e,rect=canvas.getBoundingClientRect();return{x:t.clientX-rect.left,y:t.clientY-rect.top}}canvas.addEventListener('touchstart',e=>{e.preventDefault();pointer.active=true;const p=pointerPos(e);pointer.x=p.x;pointer.y=p.y;player.boosting=true},{passive:false});canvas.addEventListener('touchmove',e=>{e.preventDefault();const p=pointerPos(e);pointer.x=p.x;pointer.y=p.y},{passive:false});canvas.addEventListener('touchend',e=>{e.preventDefault();pointer.active=false;player.boosting=false},{passive:false});canvas.addEventListener('mousedown',e=>{pointer.active=true;const p=pointerPos(e);pointer.x=p.x;pointer.y=p.y;player.boosting=true});window.addEventListener('mousemove',e=>{if(!pointer.active)return;const p=pointerPos(e);pointer.x=p.x;pointer.y=p.y});window.addEventListener('mouseup',()=>{pointer.active=false;player.boosting=false});startBtn.addEventListener('click',()=>{resetGame();overlay.style.display='none';finalScore.style.display='none';document.querySelector('#overlay h1').textContent='🐍 Mini Slither';running=true;lastTime=performance.now();requestAnimationFrame(loop)})})();
</script>
</body>
</html>
